<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>问卷系统</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#17243a;font:15px/1.55 system-ui,"Microsoft YaHei",sans-serif}header{background:#173b73;color:#fff;padding:18px max(18px,calc((100% - 1100px)/2))}header h1{margin:0;font-size:24px}main{max-width:1100px;margin:24px auto;padding:0 18px}.card{background:#fff;border:1px solid #dce3ec;border-radius:10px;padding:20px;margin-bottom:18px}h2,h3{margin-top:0}label{display:block;margin:12px 0 4px;font-weight:600}input,textarea,select{width:100%;padding:9px;border:1px solid #9eabbd;border-radius:5px;font:inherit}textarea{min-height:80px}button,.button{display:inline-block;border:0;border-radius:5px;padding:9px 15px;margin:10px 7px 0 0;background:#245dc1;color:#fff;cursor:pointer;text-decoration:none;font:inherit}.secondary{background:#53657d}.danger{background:#a33232}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.survey{border-top:1px solid #dde4ed;padding:14px 0}.question{border:1px solid #dce3ec;border-radius:7px;padding:14px;margin:10px 0}.muted{color:#5b697c}.error{color:#a22020}.success{color:#176733}.choice{display:flex;gap:8px;align-items:center;font-weight:400}.choice input{width:auto}.actions{display:flex;flex-wrap:wrap}.stat{padding:18px 0;border-top:1px solid #e1e6ed}.stat h4{margin:0 0 4px}.stats-table{width:100%;border-collapse:collapse;margin-top:12px}.stats-table th,.stats-table td{padding:9px;border-bottom:1px solid #dce3ec;text-align:left}.bar-track{height:10px;background:#e3e9f1;border-radius:5px;min-width:120px}.bar{height:100%;background:#3474d4;border-radius:5px}.answer-list{margin:10px 0;padding-left:22px}.metric{font-size:24px;font-weight:700;color:#245dc1}[hidden]{display:none!important}@media(max-width:700px){.grid{grid-template-columns:1fr}.bar-track{min-width:70px}}
</style></head><body><header><h1>MongoDB 问卷系统</h1></header><main>
<section id="auth" class="card"><h2>注册或登录</h2><div class="grid"><div><label>用户名</label><input id="username" maxlength="100"></div><div><label>密码</label><input id="password" type="password" minlength="8" maxlength="128"></div></div><button id="login">登录</button><button id="register" class="secondary">注册</button></section>
<section id="workspace" hidden><div class="card"><span id="welcome"></span><button id="logout" class="secondary">退出</button></div><section id="dashboard"><div class="card"><h2>我的问卷</h2><div class="grid"><div><label>标题</label><input id="new-title" name="new-survey-title" maxlength="200" autocomplete="off" autocapitalize="off" spellcheck="false"></div><div><label>说明</label><input id="new-description" name="new-survey-description" autocomplete="off" autocapitalize="off" spellcheck="false"></div></div><button id="create-survey">创建草稿</button><div id="survey-list"></div></div></section>
<section id="editor" hidden><div class="card"><button class="secondary" onclick="showDashboard()">返回列表</button><h2 id="editor-title"></h2><p id="editor-status"></p><div id="settings"></div><div id="question-list"></div></div>
<div id="question-form" class="card"><h3 id="question-form-title">添加题目</h3><div class="grid"><div><label>题目内容</label><input id="q-title" name="new-question-content" autocomplete="off" autocapitalize="off" spellcheck="false"></div><div><label>题型</label><select id="q-type"><option value="single">单选</option><option value="multiple">多选</option><option value="text">文本</option><option value="number">数字</option></select></div></div><label class="choice"><input id="q-required" type="checkbox">必答</label><div id="q-options-group"><label>选项（每行一个）</label><textarea id="q-options" placeholder="选项 A&#10;选项 B" autocomplete="off" spellcheck="false"></textarea></div><div id="q-multiple-rules" class="grid" hidden><div><label>最少选择数</label><input id="q-min-selections" type="number" min="0"></div><div><label>最多选择数</label><input id="q-max-selections" type="number" min="0"></div></div><div id="q-text-rules" class="grid" hidden><div><label>最少字符数</label><input id="q-min-length" type="number" min="0"></div><div><label>最多字符数</label><input id="q-max-length" type="number" min="0"></div></div><div id="q-number-rules" hidden><div class="grid"><div><label>最小值</label><input id="q-min-number" type="number"></div><div><label>最大值</label><input id="q-max-number" type="number"></div></div><label class="choice"><input id="q-integer" type="checkbox">必须是整数</label></div><button id="add-question">添加题目</button><button id="cancel-question-edit" class="secondary" hidden>取消修改</button></div>
<div id="rules-form" class="card"><h3>跳转规则</h3><p class="muted">规则按列表顺序判断，第一条命中的规则生效。未命中则进入下一题。</p><div class="grid"><div><label>源题目</label><select id="rule-source"></select></div><div><label>判断条件</label><select id="rule-operator"></select></div></div><div id="rule-value-area"></div><label>跳转到</label><select id="rule-target"></select><button id="add-rule">添加规则</button><div id="rule-list"></div><button id="save-rules">保存全部规则</button></div><div class="card actions"><button id="publish">发布问卷</button><button id="close" class="danger">关闭问卷</button><button id="statistics" class="secondary">查看统计</button></div><div id="statistics-result" class="card" hidden></div></section></section>
<section id="filler" hidden><div class="card"><h2 id="fill-title"></h2><p id="fill-description"></p><form id="answer-form"></form><button id="submit-response">提交答卷</button></div></section><p id="message" class="card" role="status" aria-live="polite" hidden></p></main><script>
const $=id=>document.getElementById(id);let currentUser,currentSurvey,fillSurvey,draftRules=[],editingQuestionId=null;function msg(t,e=false){let box=$('message');box.hidden=false;box.textContent=t;box.className='card '+(e?'error':'success')}
async function api(path,method='GET',body){let o={method,headers:{}};if(body!==undefined){o.headers['Content-Type']='application/json';o.body=JSON.stringify(body)}let r=await fetch(path,o),d={};try{d=await r.json()}catch{}if(!r.ok){let x=d.detail;if(Array.isArray(x))x=x.map(i=>i.msg).join('；');throw Error(x||'请求失败')}return d}
async function auth(a){let username=$('username').value.trim(),password=$('password').value;if(!username)return msg('请先输入用户名',true);if(password.length<8)return msg('密码至少需要 8 个字符',true);msg(a==='register'?'正在注册…':'正在登录…');try{let u=await api('/api/auth/'+a,'POST',{username,password});if(a==='register')msg('注册成功，请点击登录');else{currentUser=u;showWorkspace();msg('登录成功')}}catch(e){msg(e.message,true)}}$('register').onclick=()=>auth('register');$('login').onclick=()=>auth('login');$('logout').onclick=async()=>{await api('/api/auth/logout','POST',{});location.href='/'};window.addEventListener('error',e=>msg('页面脚本错误：'+e.message,true));
function showWorkspace(){$('auth').hidden=true;$('workspace').hidden=false;$('welcome').textContent='当前用户：'+currentUser.username;if(location.pathname.startsWith('/survey/'))loadFill(location.pathname.split('/').pop());else loadSurveys()}
async function loadSurveys(){try{let items=await api('/api/surveys'),box=$('survey-list');box.innerHTML=items.length?'':'<p class="muted">还没有问卷。</p>';for(let s of items){let d=document.createElement('div');d.className='survey';d.innerHTML=`<strong>${esc(s.title)}</strong> <span class="muted">${s.status}</span><br>${esc(s.description)}<div><button>管理</button>${s.status==='published'?`<a class="button secondary" href="/survey/${s._id}">填写链接</a>`:''}</div>`;d.querySelector('button').onclick=()=>openSurvey(s._id);box.append(d)}}catch(e){msg(e.message,true)}}
$('create-survey').onclick=async()=>{try{let s=await api('/api/surveys','POST',{title:$('new-title').value,description:$('new-description').value});openSurvey(s._id)}catch(e){msg(e.message,true)}};function showDashboard(){$('editor').hidden=true;$('dashboard').hidden=false;loadSurveys()}
async function openSurvey(id){try{currentSurvey=await api('/api/surveys/'+id);$('dashboard').hidden=true;$('editor').hidden=false;renderEditor()}catch(e){msg(e.message,true)}}
function renderEditor(){let s=currentSurvey;$('editor-title').textContent=s.title;$('editor-status').innerHTML=`状态：${s.status}　分享地址：<code>${location.origin+s.shareUrl}</code>`;$('settings').innerHTML=`<div class="grid"><div><label>标题</label><input id="set-title" name="edit-survey-title" autocomplete="off" autocapitalize="off" spellcheck="false" value="${attr(s.title)}"><label>说明</label><textarea id="set-description" name="edit-survey-description" autocomplete="off" autocapitalize="off" spellcheck="false">${esc(s.description)}</textarea></div><div><label class="choice"><input id="set-anonymous" type="checkbox" ${s.anonymous?'checked':''}>匿名问卷</label><label>每人最多提交次数（留空不限）</label><input id="set-max" type="number" min="1" value="${s.maxSubmissionsPerUser??''}"><label>开始时间</label><input id="set-start" type="datetime-local" value="${localDate(s.startsAt)}"><label>截止时间</label><input id="set-end" type="datetime-local" value="${localDate(s.endsAt)}"></div></div><button id="save-settings">保存设置</button>`;$('save-settings').onclick=saveSettings;$('save-settings').disabled=s.status!=='draft';$('question-form').hidden=s.status!=='draft';$('rules-form').hidden=s.status!=='draft';$('publish').hidden=s.status!=='draft';$('close').hidden=s.status!=='published';$('statistics').hidden=s.status==='draft';let box=$('question-list');box.innerHTML='<h3>题目</h3>';for(let q of s.questions){let d=document.createElement('div');d.className='question';d.innerHTML=`<strong>${esc(q.title)}</strong> <code>${typeName(q.type)}</code> ${q.required?'（必答）':''}<br><small>ID: ${q._id}</small>${q.options?'<p>'+q.options.map(o=>esc(o.label)).join('；')+'</p>':''}${s.status==='draft'?'<button class="edit-question">修改</button><button class="danger delete-question">删除</button>':''}`;let edit=d.querySelector('.edit-question'),remove=d.querySelector('.delete-question');if(edit)edit.onclick=()=>beginEditQuestion(q._id);if(remove)remove.onclick=()=>deleteQuestion(q._id);box.append(d)}draftRules=s.jumpRules.map(r=>structuredClone(r));if(s.status==='draft')renderRuleBuilder()}
async function saveSettings(){try{let b={title:$('set-title').value,description:$('set-description').value,anonymous:$('set-anonymous').checked,maxSubmissionsPerUser:$('set-max').value?+$('set-max').value:null,startsAt:$('set-start').value?new Date($('set-start').value).toISOString():null,endsAt:$('set-end').value?new Date($('set-end').value).toISOString():null};currentSurvey=await api('/api/surveys/'+currentSurvey._id,'PATCH',b);renderEditor();msg('设置已保存')}catch(e){msg(e.message,true)}}
function optionalNumber(id){return $(id).value===''?undefined:Number($(id).value)}function updateQuestionFields(){let t=$('q-type').value;$('q-options-group').hidden=!['single','multiple'].includes(t);$('q-multiple-rules').hidden=t!=='multiple';$('q-text-rules').hidden=t!=='text';$('q-number-rules').hidden=t!=='number'}$('q-type').onchange=updateQuestionFields;updateQuestionFields();
function resetQuestionForm(){editingQuestionId=null;$('question-form-title').textContent='添加题目';$('add-question').textContent='添加题目';$('cancel-question-edit').hidden=true;$('q-title').value='';$('q-type').value='single';$('q-required').checked=false;$('q-options').value='';for(let id of ['q-min-selections','q-max-selections','q-min-length','q-max-length','q-min-number','q-max-number'])$(id).value='';$('q-integer').checked=false;updateQuestionFields()}
function beginEditQuestion(id){let q=currentSurvey.questions.find(x=>x._id===id);if(!q)return;editingQuestionId=id;$('question-form-title').textContent='修改题目';$('add-question').textContent='保存修改';$('cancel-question-edit').hidden=false;$('q-title').value=q.title;$('q-type').value=q.type;$('q-required').checked=q.required;$('q-options').value=(q.options||[]).map(o=>o.label).join('\n');$('q-min-selections').value=q.validation.minSelections??'';$('q-max-selections').value=q.validation.maxSelections??'';$('q-min-length').value=q.validation.minLength??'';$('q-max-length').value=q.validation.maxLength??'';$('q-min-number').value=q.validation.min??'';$('q-max-number').value=q.validation.max??'';$('q-integer').checked=!!q.validation.integerOnly;updateQuestionFields();$('question-form').scrollIntoView({behavior:'smooth',block:'start'});$('q-title').focus()}$('cancel-question-edit').onclick=resetQuestionForm;
$('add-question').onclick=async()=>{try{let type=$('q-type').value,validation={},original=editingQuestionId?currentSurvey.questions.find(x=>x._id===editingQuestionId):null,b={title:$('q-title').value,type,required:$('q-required').checked,validation};if(['single','multiple'].includes(type)){let labels=$('q-options').value.split(/\n/).map(x=>x.trim()).filter(Boolean),oldOptions=original&&['single','multiple'].includes(original.type)?original.options:[],used=new Set(oldOptions.map(o=>o.id));b.options=labels.map((label,i)=>{if(oldOptions[i])return{id:oldOptions[i].id,label};let n=1;while(used.has('option_'+n))n++;let id='option_'+n;used.add(id);return{id,label}})}if(type==='multiple'){let min=optionalNumber('q-min-selections'),max=optionalNumber('q-max-selections');if(min!==undefined)validation.minSelections=min;if(max!==undefined)validation.maxSelections=max}if(type==='text'){let min=optionalNumber('q-min-length'),max=optionalNumber('q-max-length');if(min!==undefined)validation.minLength=min;if(max!==undefined)validation.maxLength=max}if(type==='number'){let min=optionalNumber('q-min-number'),max=optionalNumber('q-max-number');if(min!==undefined)validation.min=min;if(max!==undefined)validation.max=max;validation.integerOnly=$('q-integer').checked}let editing=editingQuestionId,path=`/api/surveys/${currentSurvey._id}/questions${editing?'/'+editing:''}`;await api(path,editing?'PATCH':'POST',b);resetQuestionForm();await openSurvey(currentSurvey._id);msg(editing?'题目修改已保存':'题目已添加')}catch(e){msg(e.message,true)}};async function deleteQuestion(id){try{if(editingQuestionId===id)resetQuestionForm();await api(`/api/surveys/${currentSurvey._id}/questions/${id}`,'DELETE');await openSurvey(currentSurvey._id)}catch(e){msg(e.message,true)}}
function typeName(t){return{single:'单选',multiple:'多选',text:'文本',number:'数字'}[t]||t}function questionName(id){let q=currentSurvey.questions.find(x=>x._id===id);return q?q.title:'未知题目'}function renderRuleBuilder(){let sources=currentSurvey.questions.filter(q=>q.type!=='text'),source=$('rule-source');source.innerHTML=sources.map(q=>`<option value="${q._id}">${esc(q.title)}（${typeName(q.type)}）</option>`).join('');$('add-rule').disabled=!sources.length;updateRuleCondition();renderRuleList()}function updateRuleCondition(){let q=currentSurvey.questions.find(x=>x._id===$('rule-source').value),op=$('rule-operator'),area=$('rule-value-area'),target=$('rule-target');if(!q){op.innerHTML='';area.innerHTML='';target.innerHTML='';return}let ops=q.type==='single'?[['equals','等于']]:q.type==='multiple'?[['containsAny','包含任意选项'],['containsAll','包含全部选项']]:[['eq','等于'],['gt','大于'],['gte','大于等于'],['lt','小于'],['lte','小于等于']];op.innerHTML=ops.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('');if(q.type==='single')area.innerHTML='<label>选择答案</label><select id="rule-value">'+q.options.map(o=>`<option value="${attr(o.id)}">${esc(o.label)}</option>`).join('')+'</select>';else if(q.type==='multiple')area.innerHTML='<label>选择用于判断的选项</label>'+q.options.map(o=>`<label class="choice"><input class="rule-value-check" type="checkbox" value="${attr(o.id)}">${esc(o.label)}</label>`).join('');else area.innerHTML='<label>比较数值</label><input id="rule-value" type="number">';let i=currentSurvey.questions.indexOf(q),targets=currentSurvey.questions.slice(i+1);target.innerHTML=targets.map(x=>`<option value="${x._id}">${esc(x.title)}</option>`).join('')+'<option value="">结束问卷</option>'} $('rule-source').onchange=updateRuleCondition;
function resetRuleForm(){$('rule-source').selectedIndex=0;updateRuleCondition()}
$('add-rule').onclick=()=>{try{let q=currentSurvey.questions.find(x=>x._id===$('rule-source').value);if(!q)throw Error('请先添加可设置跳转的题目');let value;if(q.type==='multiple')value=[...document.querySelectorAll('.rule-value-check:checked')].map(x=>x.value);else if(q.type==='number')value=Number($('rule-value').value);else value=$('rule-value').value;if(q.type==='multiple'&&!value.length)throw Error('请至少选择一个判断选项');if(q.type==='number'&&$('rule-value').value==='')throw Error('请输入比较数值');draftRules.push({sourceQuestionId:q._id,condition:{operator:$('rule-operator').value,value},targetQuestionId:$('rule-target').value||null});renderRuleList();resetRuleForm();msg('规则已加入列表，请保存全部规则')}catch(e){msg(e.message,true)}};function renderRuleList(){let box=$('rule-list');box.innerHTML=draftRules.length?'<h4>已配置规则</h4>':'<p class="muted">尚未配置跳转规则。</p>';draftRules.forEach((r,i)=>{let d=document.createElement('div');d.className='question';let value=Array.isArray(r.condition.value)?r.condition.value.join('、'):r.condition.value;d.innerHTML=`${i+1}. 当“${esc(questionName(r.sourceQuestionId))}”满足 ${esc(r.condition.operator)} ${esc(value)}，跳到“${r.targetQuestionId?esc(questionName(r.targetQuestionId)):'结束问卷'}” <button class="danger">删除</button>`;d.querySelector('button').onclick=()=>{draftRules.splice(i,1);renderRuleList()};box.append(d)})}
$('save-rules').onclick=async()=>{try{await api(`/api/surveys/${currentSurvey._id}/jump-rules`,'PUT',{rules:draftRules});await openSurvey(currentSurvey._id);msg('规则已保存')}catch(e){msg(e.message,true)}};$('publish').onclick=async()=>{try{currentSurvey=await api(`/api/surveys/${currentSurvey._id}/publish`,'POST',{});renderEditor();msg('已发布')}catch(e){msg(e.message,true)}};$('close').onclick=async()=>{try{await api(`/api/surveys/${currentSurvey._id}/close`,'POST',{});await openSurvey(currentSurvey._id)}catch(e){msg(e.message,true)}};
function renderStatistic(q){let head=`<h4>${esc(q.title)}</h4><p class="muted">题型：${typeName(q.type)}　有效回答：${q.answeredCount} 份</p>`;if(q.type==='single'||q.type==='multiple'){let rows=q.options.map(o=>{let percent=q.answeredCount?o.count/q.answeredCount*100:0;return `<tr><td>${esc(o.label)}</td><td>${o.count}</td><td>${percent.toFixed(1)}%</td><td><div class="bar-track"><div class="bar" style="width:${Math.min(percent,100)}%"></div></div></td></tr>`}).join('');return `<div class="stat">${head}<table class="stats-table"><thead><tr><th>选项</th><th>选择次数</th><th>占回答份数</th><th>比例</th></tr></thead><tbody>${rows}</tbody></table>${q.type==='multiple'?'<p class="muted">多选题中，同一份答卷可以计入多个选项。</p>':''}</div>`}if(q.type==='number'){let values=q.values.length?q.values.map(v=>`<li>${esc(v)}</li>`).join(''):'<li class="muted">暂无回答</li>';return `<div class="stat">${head}<p>平均值：<span class="metric">${q.average===null?'—':Number(q.average.toFixed(2))}</span></p><details><summary>查看全部数值</summary><ol class="answer-list">${values}</ol></details></div>`}let values=q.values.length?q.values.map(v=>`<li>${esc(v)}</li>`).join(''):'<li class="muted">暂无回答</li>';return `<div class="stat">${head}<ol class="answer-list">${values}</ol></div>`}
$('statistics').onclick=async()=>{try{let s=await api(`/api/surveys/${currentSurvey._id}/statistics`),box=$('statistics-result');box.hidden=false;box.innerHTML=`<h3>${esc(s.title)}的统计结果</h3><p>共收到 <span class="metric">${s.responseCount}</span> 份答卷</p>`+s.questions.map(renderStatistic).join('');box.scrollIntoView({behavior:'smooth',block:'start'})}catch(e){msg(e.message,true)}};
async function loadFill(id){try{fillSurvey=await api('/api/fill/'+id);$('dashboard').hidden=true;$('filler').hidden=false;$('fill-title').textContent=fillSurvey.title;$('fill-description').textContent=fillSurvey.description+(fillSurvey.anonymous?'（匿名问卷）':'');let f=$('answer-form');f.innerHTML='';for(let q of fillSurvey.questions)f.append(questionControl(q));updateFlow();$('submit-response').disabled=!fillSurvey.canSubmit;if(!fillSurvey.canSubmit)msg('已达到允许填写次数',true)}catch(e){msg(e.message,true)}}
function questionControl(q){let d=document.createElement('div');d.className='question';d.dataset.qid=q._id;let t=document.createElement('strong');t.textContent=q.title+(q.required?' *':'');d.append(t);if(['single','multiple'].includes(q.type)){for(let o of q.options){let l=document.createElement('label');l.className='choice';l.innerHTML=`<input type="${q.type==='single'?'radio':'checkbox'}" name="q-${q._id}" value="${attr(o.id)}"> ${esc(o.label)}`;d.append(l)}}else{let i=document.createElement('input');i.name='q-'+q._id;i.type=q.type==='number'?'number':'text';if(q.type==='number')i.step=q.validation.integerOnly?'1':'any';d.append(i)}d.onchange=updateFlow;d.oninput=updateFlow;return d}
function answerOf(q){let f=[...document.querySelectorAll(`[name="q-${q._id}"]`)];if(q.type==='single')return f.find(x=>x.checked)?.value;if(q.type==='multiple'){let v=f.filter(x=>x.checked).map(x=>x.value);return v.length?v:undefined}if(f[0].value!=='')return q.type==='number'?+f[0].value:f[0].value}
function ruleMatch(c,v){if(v===undefined)return false;if(c.operator==='equals'||c.operator==='eq')return v===c.value;if(c.operator==='containsAny')return c.value.some(x=>v.includes(x));if(c.operator==='containsAll')return c.value.every(x=>v.includes(x));return c.operator==='gt'?v>c.value:c.operator==='gte'?v>=c.value:c.operator==='lt'?v<c.value:v<=c.value}
function updateFlow(){if(!fillSurvey)return;let ids=fillSurvey.questions.map(q=>q._id),visible=new Set(),i=0;while(i<ids.length){let id=ids[i],q=fillSurvey.questions[i];visible.add(id);let v=answerOf(q),rule=fillSurvey.jumpRules.find(r=>r.sourceQuestionId===id&&ruleMatch(r.condition,v));if(rule){if(rule.targetQuestionId===null)break;i=ids.indexOf(rule.targetQuestionId)}else i++}for(let q of fillSurvey.questions){let box=document.querySelector(`[data-qid="${q._id}"]`),show=visible.has(q._id);box.hidden=!show;if(!show)for(let field of box.querySelectorAll('input')){field.checked=false;if(!['radio','checkbox'].includes(field.type))field.value=''}}}
$('submit-response').onclick=async()=>{try{let answers=[];for(let q of fillSurvey.questions){if(document.querySelector(`[data-qid="${q._id}"]`).hidden)continue;let value=answerOf(q);if(value!==undefined)answers.push({questionId:q._id,value})}let r=await api(`/api/fill/${fillSurvey.id}/responses`,'POST',{requestId:crypto.randomUUID(),answers});msg('提交成功，这是第 '+r.attempt+' 次提交');$('submit-response').disabled=true}catch(e){msg(e.message,true)}};
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function attr(v){return esc(v)}function localDate(v){if(!v)return'';let d=new Date(v),o=d.getTimezoneOffset();return new Date(d-o*60000).toISOString().slice(0,16)}api('/api/auth/me').then(u=>{currentUser=u;showWorkspace()}).catch(()=>{});
</script></body></html>
